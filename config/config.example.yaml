application:
  name: local-ai
  environment: development
  log_level: INFO

inference:
  provider: ollama
  base_url: http://192.168.1.10:11434
  default_model: qwen3:4b
  timeout: 180
  # Whether thinking models (qwen3) reason before answering. Leave empty for
  # the model's default; the reasoning is hidden either way. true or false
  # sends the setting, but some qwen3 versions still reason (and show it) when
  # it's false. Override with --think on|off or /think in the chat.
  think:

storage:
  # Conversations are saved here (relative to the local-ai folder). Set
  # save_conversations to false, or run with --no-save, to turn it off.
  database: data/databases/local_ai.db
  save_conversations: true
  projects: projects/
  logs: logs/

agents:
  default_agent: general
  # The most times one message can go back and forth with tool results
  # before the model has to answer.
  max_iterations: 10
  require_approval_for_tools: true

tools:
  # Lets the model ask the app to list folders, read files and search your
  # documents. Turn off for one chat with --no-tools, or /tools off.
  enabled: true
  # The only folders the tools can read (relative to the local-ai folder, or
  # full paths). "." is the local-ai folder itself, so the model can read the
  # app's own code.
  folders:
    - knowledge
    - .
  # Refused even inside those folders. Hidden files and folders (.git, .env,
  # .venv, ...) are always refused.
  blocked:
    - config/local.yaml
    - config/secrets.yaml
    - "*.db"
  max_read_chars: 4000     # read_file returns long files in pieces this size
  max_list_entries: 200
knowledge:
  # Folders the app may read documents from (relative to the local-ai folder,
  # or full paths like "C:/Users/me/Documents/notes"). Nothing outside these
  # is indexed. Run `python -m app.main --index` after adding files.
  folders:
    - knowledge
  # The index of chunks and embeddings. Each embedding model gets its own file
  # next to this name (knowledge-nomic-embed-text.db, ...), so you can switch
  # with /embed without losing the other one. Safe to delete; --index rebuilds it.
  database: data/indexes/knowledge.db
  # Embedding model on the Ollama server. Install it on the ai-pc with
  # `ollama pull nomic-embed-text`. Try another for one chat with /embed <name>
  # or --embed-model <name>.
  embedding_model: nomic-embed-text
  # Labels some models want in front of documents and questions. Left out,
  # the right ones are used for nomic-embed-text and qwen3-embedding, and none
  # for other models.
  # document_prefix: "search_document: "
  # query_prefix: "search_query: "
  chunk_size: 1000      # characters per chunk
  chunk_overlap: 150    # a small paragraph this size or less is repeated at the start of the next chunk
  max_file_mb: 20       # bigger files are skipped
  # extensions: [.md, .txt, .pdf, .docx]   # left out, text, code, PDF and Word files are read
  top_k: 4              # passages given to the model with each question
  # How close a passage must be to the question to be used, from 0 to 1.
  # A first guess: check the "match" scores with /sources and adjust.
  min_score: 0.5
  use_in_chat: true     # turn off for one chat with --no-kb, or /kb off
